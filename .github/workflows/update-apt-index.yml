---
name: update-apt-index

on:
  push:
    paths:
      - "pool/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apt-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev apt-utils

      - name: Scan pool and generate Packages
        run: |
          set -euo pipefail

          DIST_DIR="dists/termux/main/binary-aarch64"
          mkdir -p "${DIST_DIR}"

          echo "==> Scanning pool/main/ for .deb files"
          find pool/main -name "*.deb" | head -20
          echo "..."

          echo "==> Generating Packages (uncompressed)"
          dpkg-scanpackages --arch aarch64 pool/main /dev/null \
            > "${DIST_DIR}/Packages"

          echo "==> Generating Packages.gz"
          gzip -9 -k -f "${DIST_DIR}/Packages"

          echo "==> Package count:"
          grep -c "^Package:" "${DIST_DIR}/Packages" || echo "0"

      - name: Generate Release
        run: |
          set -euo pipefail
          apt-ftparchive release \
            -o APT::FTPArchive::Release::Origin="debmaker-cpp" \
            -o APT::FTPArchive::Release::Label="debmaker-cpp" \
            -o APT::FTPArchive::Release::Suite="termux" \
            -o APT::FTPArchive::Release::Codename="termux" \
            -o APT::FTPArchive::Release::Architectures="aarch64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="debmaker-cpp Termux APT Repository" \
            dists/termux/ \
            > dists/termux/Release

          echo "==> Release generated:"
          head -10 dists/termux/Release

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dists/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto update Packages [skip ci]"
          git pull --rebase --autostash origin main
          git push
