---
name: update-apt-index

on:
  push:
    paths:
      - "pool/**"

permissions:
  contents: write

concurrency:
  group: apt-index
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev

      - name: Regenerate Packages and Release
        run: |
          set -euo pipefail

          DIST_DIR="dists/termux/main/binary-aarch64"
          mkdir -p "${DIST_DIR}"

          echo "==> Regenerating Packages"
          dpkg-scanpackages --arch aarch64 pool/main \
            > "${DIST_DIR}/Packages"
          gzip -9 -k -f "${DIST_DIR}/Packages"

          echo "==> Regenerating Release"
          apt-ftparchive release \
            -o APT::FTPArchive::Release::Origin="debmaker-cpp" \
            -o APT::FTPArchive::Release::Label="debmaker-cpp" \
            -o APT::FTPArchive::Release::Suite="termux" \
            -o APT::FTPArchive::Release::Codename="termux" \
            -o APT::FTPArchive::Release::Architectures="aarch64" \
            -o APT::FTPArchive::Release::Components="main" \
            dists/termux \
            > dists/termux/Release

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto update Packages [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No changes to commit"
          fi
